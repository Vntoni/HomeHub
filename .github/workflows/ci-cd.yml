name: CI/CD – Test & Deploy to RPi5

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────
  # JOB 1 – testy (GitHub cloud runner)
  # ────────────────────────────────────────────
  test:
    name: Run pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system Qt/GL libs (headless)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1-mesa-dev libglib2.0-0 \
            xvfb libxcb-cursor0 libpulse0

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-demo.txt -c requirements-test-constraints.txt

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Check syntax and project integrity
        run: python Tests/check_integrity.py

      - name: Run offline unit, regression and QML checks
        run: python Tests/run_offline.py

      - name: Upload test results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homehub-test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  # ────────────────────────────────────────────
  # JOB 2 – build + deploy na RPi5
  # Działa jako self-hosted runner NA RPi5:
  # - ten sam ARM64 CPU → PyInstaller działa
  # - RPi5 łączy się z GitHub (wychodzące) → nie trzeba otwierać portów
  # ────────────────────────────────────────────
  deploy:
    name: Build & Deploy on RPi5
    runs-on: self-hosted
    needs: test
    concurrency:
      group: raspberrypi5-deploy
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v5

      - name: Connect to the application user session
        shell: bash
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          if [ ! -S "$XDG_RUNTIME_DIR/bus" ]; then
            echo "::error::User D-Bus is unavailable. On the Pi, run: sudo loginctl enable-linger $(id -un)"
            echo "::error::Then log in as the application user and verify: systemctl --user status bazadomowa"
            exit 1
          fi
          systemctl --user cat bazadomowa.service > /dev/null
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: |
          ~/.virtualenvs/Baza_Domowa/bin/pip install -r requirements.txt --quiet

      - name: Check AC adapter imports with the installed Pi SDK
        run: |
          ~/.virtualenvs/Baza_Domowa/bin/python -c 'from Adapters.airstage_ac_adapter import AirstageACAdapter; from importlib.metadata import version; print("AC adapter import OK; pyairstage=" + version("pyairstage"))'

      - name: Test shutdown offline with Pi Qt and qasync
        # Trusted main only; fake devices, offscreen Qt, live app still running.
        run: |
          ~/.virtualenvs/Baza_Domowa/bin/python Tests/run_offline.py --smoke-only shutdown_smoke window_close_smoke qml_quit_smoke shutdown_error_smoke qml_failure_smoke

      - name: Check optional audio imports on Pi (no recording)
        run: |
          ~/.virtualenvs/Baza_Domowa/bin/python -c 'from Adapters.qt_audio_probe import QtAudioProbe; print("Qt audio adapter import OK; no devices opened")'

      - name: Build with PyInstaller
        run: |
          ~/.virtualenvs/Baza_Domowa/bin/python build_app.py

      - name: Preserve application configuration
        shell: bash
        run: |
          mkdir -p "$HOME/.config/bazadomowa"
          if [ ! -f "$HOME/.config/bazadomowa/.env" ]; then
            for source in "$HOME/app/BazaDomowa/.env" "$HOME/Baza_Domowa/Config/.env"; do
              if [ -f "$source" ]; then
                install -m 600 "$source" "$HOME/.config/bazadomowa/.env"
                break
              fi
            done
          fi

      - name: Stop app service before replacing binary
        run: systemctl --user stop bazadomowa

      - name: Replace binary
        run: |
          rm -rf ~/app/BazaDomowa
          cp -r dist/BazaDomowa ~/app/BazaDomowa
          chmod +x ~/app/BazaDomowa/BazaDomowa

      - name: Configure service to run the deployed binary
        run: |
          mkdir -p "$HOME/.config/systemd/user/bazadomowa.service.d"
          cat > "$HOME/.config/systemd/user/bazadomowa.service.d/10-deployment.conf" <<'UNIT'
          [Service]
          Restart=no
          ExecStart=
          ExecStart=%h/app/BazaDomowa/BazaDomowa
          WorkingDirectory=%h/app/BazaDomowa
          UNIT
          systemctl --user daemon-reload
          systemctl --user reset-failed bazadomowa

      - name: Start app service
        run: |
          systemctl --user start bazadomowa
          sleep 10
          if ! systemctl --user is-active --quiet bazadomowa; then
            systemctl --user status bazadomowa --no-pager -l || true
            journalctl _SYSTEMD_USER_UNIT=bazadomowa.service _UID="$(id -u)" --since "5 minutes ago" -n 60 --no-pager
            exit 1
          fi
          systemctl --user status bazadomowa --no-pager
