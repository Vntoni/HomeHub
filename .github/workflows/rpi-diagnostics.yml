name: Raspberry Pi service diagnostics
on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: Run model-only candidate benchmark without enabling the app
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5
      - name: Read local voice configuration without credentials
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          systemctl --user show homehub-agent --property=ActiveState,SubState,MemoryCurrent || true
          ~/.virtualenvs/Baza_Domowa/bin/python - <<'PYTHON'
          from pathlib import Path
          from dotenv import dotenv_values
          import subprocess
          home = Path.home()
          environment = subprocess.check_output(['systemctl', '--user', 'show', 'bazadomowa', '-p', 'Environment', '--value'], text=True)
          import shlex
          entries = dict(item.split('=', 1) for item in shlex.split(environment) if '=' in item)
          print('Service HOMEHUB_LOCAL_AGENT:', entries.get('HOMEHUB_LOCAL_AGENT', '(unset)'))
          for path in [home/'app/BazaDomowa/.env', home/'.config/bazadomowa/.env']:
              if path.exists():
                  print(str(path), 'HOMEHUB_LOCAL_AGENT:', dotenv_values(path).get('HOMEHUB_LOCAL_AGENT', '(unset)'))
          print('Local model installed:', (home/'.local/share/homehub/agent/LFM3-1.7B-Q4_K_M.gguf').is_file())
          PYTHON
      - name: Apply candidate model buffers for benchmark only
        if: inputs.benchmark
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          install -m 644 deploy/homehub-agent.service "$HOME/.config/systemd/user/homehub-agent.service"
          systemctl --user daemon-reload
          systemctl --user restart homehub-agent
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9081/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Probe one synthetic model request
        run: |
          ~/.virtualenvs/Baza_Domowa/bin/python - <<'PYTHON'
          import httpx
          from Adapters.local_intent import PROMPT, SCHEMA
          with httpx.Client(trust_env=False, timeout=60) as client:
              props = client.get('http://127.0.0.1:9081/props').json()
              print('Template tail:', props.get('chat_template', '')[-400:])
              payload = {'model': 'homehub-local', 'stream': False, 'temperature': .1, 'max_tokens': 80,
                  'chat_template_kwargs': {'enable_thinking': False},
                  'messages': [{'role': 'system', 'content': PROMPT + '\nPrevious intent: {"kind":"unknown","room":"unknown"}'},
                               {'role':'user','content':'Jak ciepło jest w salonie?'}],
                  'cache_prompt': True}
              for question in ['Jak ciepło jest w salonie?', 'Proszę powiedz mi jaka jest temperatura w salonie', 'Sprawdź wilgotność']:
                  payload['messages'][-1]['content'] = question
                  response = client.post('http://127.0.0.1:9081/v1/chat/completions', json=payload)
                  print('Question:', question, 'HTTP:', response.status_code)
                  print('Synthetic response:', response.text[:2500])
          PYTHON
      - name: Check three representative classifications
        if: inputs.benchmark
        run: ~/.virtualenvs/Baza_Domowa/bin/python Tools/local_agent_smoke.py
      - name: Benchmark candidate model client without changing app configuration
        if: inputs.benchmark
        run: ~/.virtualenvs/Baza_Domowa/bin/python Tools/benchmark_local_agent.py --output candidate-model-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always() && inputs.benchmark
        with:
          name: candidate-model-benchmark
          path: candidate-model-benchmark.json
          if-no-files-found: warn
      - name: Read HomeHub service status and recent logs
        shell: bash
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          systemctl --user show bazadomowa.service --property=ActiveState,SubState,Result,ExecMainCode,ExecMainStatus,ExecStart,WorkingDirectory,StandardOutput,StandardError,FragmentPath
          systemctl --user status bazadomowa.service --no-pager -l || true
          journalctl _SYSTEMD_USER_UNIT=bazadomowa.service _UID="$(id -u)" --since '10 minutes ago' -n 80 --no-pager
